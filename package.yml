package: community.lazycat.app.gosonic
version: 0.1.0
name: GoSonic
description: "Self-hosted Subsonic / OpenSubsonic music server powered by MyGo Music plugins"
min_os_version: 1.5.0
homepage: https://github.com/miantiao-me/GoSonic
author: miantiao-me
license: AGPL-3.0
locales:
  zh:
    name: GoSonic
    description: "基于 MyGo Music 插件的自托管 Subsonic / OpenSubsonic 音乐服务器，支持多音源聚合、滚动歌词与按需转码"
    usage: |
      GoSonic 是基于 MyGo Music 插件的自托管 Subsonic / OpenSubsonic 音乐服务器。

      **首次使用**
      1. 打开应用，用安装时设置的管理员账号登录 Web 控制台
      2. 在控制台点击「+ 添加插件」，填入 MyGo Music 插件仓库（如 hubandad/mygo-music-netease、djyde/mygo-lizhi），确认安装并审核权限
      3. 需要登录音乐平台的插件，可在控制台扫码或粘贴 Cookie 登录

      **连接播放器**
      在任意 Subsonic 客户端（MuseAmp、Feishin、Symfonium、Amperfy 等）中填入：
      - 服务器地址：本应用的访问地址（懒猫微服内直接用应用地址）
      - 用户名 / 密码：安装时设置的管理员账号

      **说明**
      - 每个插件对应一个独立音乐库（MusicFolder），可分源浏览或跨源搜索
      - 客户端请求转码时由内置 FFmpeg 实时处理；默认音质为安装时选择的档位
      - 数据保存在应用数据目录，卸载前请自行备份插件配置
en:
  usage: |-
    GoSonic is a self-hosted Subsonic / OpenSubsonic music server powered by MyGo Music plugins.

    **First steps**
    1. Open the app and sign in to the web console with the admin account set during installation
    2. Click "+ Add Plugin" and enter a MyGo Music plugin repository (e.g. hubandad/mygo-music-netease, djyde/mygo-lizhi), review permissions and confirm
    3. For plugins that need platform accounts, sign in via QR code or paste a Cookie in the console

    **Connect a player**
    In any Subsonic client (MuseAmp, Feishin, Symfonium, Amperfy, ...), configure:
    - Server address: this app's URL (use the in-box app address inside LazyCat)
    - Username / password: the admin account set at installation

    **Notes**
    - Each plugin appears as its own MusicFolder; browse per source or search across all
    - On-demand transcoding is handled by the bundled FFmpeg; default quality follows the installation choice
    - Data lives in the app data directory; back up plugin config before uninstalling
